server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Проксируем /api/* на api-контейнер внутри docker-сети (по имени
    # сервиса из docker-compose.yml). Благодаря этому фронтенд ходит на
    # СВОЙ ЖЕ origin ("/api/..."), а не на жёстко прописанный домен — не
    # важно, открыт сайт на inwell.uz, на localhost при локальном тесте
    # docker-сборки или на любом другом домене, ничего в конфиге менять не
    # нужно. Порт 4000 наружу из docker-compose.yml можно вообще не
    # публиковать — сюда он не нужен.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA — react-router handles routing client-side (/corporate,
    # /personal, /personal/start, /personal/report и т.д.), поэтому все не
    # найденные на диске пути отдаём в index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
