server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — react-router handles routing client-side (/corporate,
    # /personal, /personal/start, /personal/report и т.д.), поэтому все не
    # найденные на диске пути отдаём в index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
