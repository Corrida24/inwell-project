# Боевой запуск приложения (frontend+backend) одной командой:
#   docker compose up -d --build
# Затем один раз применить схему БД:
#   docker compose run --rm api node apps/api/dist/db/migrate.js
# (путь изменился на apps/api/dist/... после перехода на npm workspaces —
# см. apps/api/Dockerfile: рабочая директория образа теперь /app целиком,
# а не /app как алиас для одного apps/api.)
#
# БАЗА ДАННЫХ — ТОЛЬКО Supabase Postgres. Docker здесь запускает исключительно
# само приложение (api + web), локального Postgres-контейнера больше нет —
# api подключается к DATABASE_URL из apps/api/.env (реальный Supabase Postgres
# connection string). Второй "локальной" базы для fallback не существует:
# если apps/api/.env не заполнен реальными Supabase-значениями, api не
# запустится (см. apps/api/.env.example).
#
# ДОМЕН НИГДЕ НЕ ЗАШИТ, кроме WEB_ORIGIN ниже (только для CORS-заголовка).
# Фронтенд ходит на API по относительному пути "/api/..." — nginx внутри
# web-контейнера проксирует его на api-контейнер по имени сервиса (см.
# apps/web/nginx.conf). Поэтому сборка одинаково работает под inwell.uz,
# под IP сервера или под любым другим доменом — ничего в этом файле
# перед каждым деплоем менять не нужно, порт api наружу тоже не публикуется.
#
# На реальном хостинге web (nginx, порт 8080) обычно стоит за отдельным
# reverse-proxy с HTTPS-терминацией на хосте (Caddy/Traefik/Nginx) под
# inwell.uz — этот compose даёт голый стек, TLS добавьте поверх.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      PORT: 4000
      # CORS: разрешённый origin фронтенда. Не участвует в обычных запросах
      # браузера (они идут через nginx-проксю на тот же origin, что и сама
      # страница — same-origin, CORS не требуется), но остаётся правильным
      # значением на случай прямых cross-origin обращений к API.
      WEB_ORIGIN: "https://inwell.uz"
    # Порт api не публикуется на хост — снаружи он не нужен, всё идёт через
    # nginx web-контейнера (location /api/ в apps/web/nginx.conf). Если
    # понадобится подебажить api напрямую с сервера — используйте
    # `docker compose exec api sh` или временно раскомментируйте порт ниже.
    # ports:
    #   - "127.0.0.1:4000:4000"
    # Не заменяет scripts/smoke-test.sh (тот бьёт через ПУБЛИЧНЫЙ домен и
    # ловит именно рассинхрон nginx-прокси, который уже один раз ронял
    # /api/ в проде) — это контейнерный healthcheck для docker/orchestrator,
    # чтобы `docker compose ps`/`restart: unless-stopped` видели, что api
    # реально отвечает, а не просто что процесс жив. node:22-alpine не
    # содержит curl из коробки, поэтому используется wget (есть в busybox).
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://inwell.uz/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # VITE_API_BASE_URL сюда осознанно НЕ передаётся — по умолчанию (см.
      # apps/web/Dockerfile) он собирается пустой строкой, а пустая строка
      # во фронтенд-коде значит "тот же origin", то есть относительные
      # запросы "/api/..." через nginx-проксю выше. Домен подставлять
      # никуда не нужно.
      #
      # А вот VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY передать
      # НУЖНО — это Vite build-time переменные для страницы /login
      # (корпоративная авторизация), и .dockerignore нарочно не пускает
      # apps/web/.env внутрь сборки. Docker Compose подставит их сюда из
      # .env-файла РЯДОМ С ЭТИМ docker-compose.yml (корень репозитория,
      # не apps/web/.env) — см. .env.example в корне. Если оставить пустыми,
      # сборка пройдёт, но /login покажет "Supabase ещё не настроен".
      args:
        VITE_SUPABASE_URL: "${VITE_SUPABASE_URL:-}"
        VITE_SUPABASE_PUBLISHABLE_KEY: "${VITE_SUPABASE_PUBLISHABLE_KEY:-}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # web's own healthcheck -- nginx:alpine also ships wget via busybox.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://inwell.uz/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8080:80"
